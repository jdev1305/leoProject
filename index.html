<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Leonidas Goals Tracker</title>

  <link 
    href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/lux/bootstrap.min.css" 
    rel="stylesheet"
  >

  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      --bg: #f8f9fa;
      --card-bg: #ffffff;
      --text: #212529;
      --table-bg: #ffffff;
      --table-text: #212529;
      --accent: #0d6efd;
      --border-color: #dee2e6;
    }

    [data-theme="dark"] {
      --bg: #121212;
      --card-bg: #202020;
      --text: #f1f5f9;
      --table-bg: #1e1e1e;
      --table-text: #f1f5f9;
      --accent: #0b35d9;
      --border-color: #444;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", Roboto, Arial, sans-serif;
      font-weight: 500;
      transition: background 0.25s ease, color 0.25s ease;
    }

    h1 {
      font-weight: 800;
      color: var(--text);
      letter-spacing: 1px;
    }

    .chart-container,
    .week-container {
      background: var(--card-bg);
      color: var(--text);
      padding: 0;
      border-radius: 14px;
      margin-bottom: 22px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.15);
      overflow: hidden;
      border: 1px solid var(--border-color);
    }

    .chart-container {
      padding: 24px;
      height: 420px;
      margin-bottom: 32px;
    }

    .week-title {
      background: linear-gradient(90deg, #0b35d9, #1c4dff);
      display: block;
      width: 100%;
      padding: 12px 18px;
      border-radius: 14px 14px 0 0;
      font-weight: 800;
      margin-bottom: 0;
      color: #fff;
      text-align: left;
      letter-spacing: 0.5px;
    }

    table {
      background: var(--table-bg) !important;
      color: var(--table-text) !important;
      width: 100%;
      border-collapse: collapse;
    }

    table th,
    table td {
      background: var(--table-bg) !important;
      color: var(--table-text) !important;
      vertical-align: middle;
      border-bottom: 1px solid var(--border-color);
      padding: 14px 16px !important;
    }

    thead tr {
      background: var(--table-bg) !important;
      color: var(--table-text) !important;
    }

    th {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .btn {
      font-size: 14px !important;
      padding: 6px 12px !important;
      line-height: 1.4 !important;
      border-radius: 10px !important;
      border: none !important;
      font-weight: 700;
    }

    .btn-group.d-flex .btn {
      flex: 1 1 auto;
      min-width: 60px;
      margin: 2px;
    }

    .btn-add { 
      background: #198754; 
      color: #fff; 
    }

    .btn-add:hover {
      background: #157347;
    }

    .btn-minus { 
      background: #fd7e14; 
      color: #fff; 
    }

    .btn-minus:hover {
      background: #dc6502;
    }

    .btn-remove { 
      background: #dc3545; 
      color: #fff; 
    }

    .btn-remove:hover {
      background: #bb2d3b;
    }

    .btn-action { 
      background: #6f42c1; 
      color: #fff; 
      height: 38px; 
      line-height: 1.2; 
      white-space: nowrap;
    }

    .btn-action:hover {
      background: #5b35a0;
    }

    .form-control {
      border-radius: 10px !important;
      height: 40px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border-color);
      color: var(--text);
    }

    .form-control:focus {
      background: rgba(255,255,255,0.06);
      color: var(--text);
      border-color: var(--accent);
      box-shadow: 0 0 0 0.2rem rgba(13,110,253,.15);
    }

    .add-player-input {
      max-width: 220px;
      flex: 0 0 auto;
    }

    #themeToggle {
      position: fixed;
      top: 15px;
      left: 15px;
      z-index: 9999;
      font-size: 14px;
      padding: 8px 14px;
      border-radius: 10px;
      font-weight: 700;
    }

    canvas {
      max-width: 100%;
    }

    @media (max-width: 576px) {
      .chart-container {
        height: 360px;
        padding: 18px;
      }

      h1 {
        font-size: 28px;
      }

      table th,
      table td {
        padding: 12px 10px !important;
      }
    }
  </style>
</head>
<body>
  <div class="container py-4">
    <button id="themeToggle" class="btn btn-secondary">🌙 Dark Mode</button>

    <h1 class="text-center mb-4">
      R.H.V.LEONIDAS H13 - TOPSCORERS 25/26
    </h1>

    <div class="chart-container">
      <canvas id="goalsChart"></canvas>
    </div>

    <div id="weeks"></div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCjNY4jonCkxLhdS9MQCg382l2y6pmPOc4",
      authDomain: "leonidasgoalstracker.firebaseapp.com",
      projectId: "leonidasgoalstracker",
      storageBucket: "leonidasgoalstracker.firebasestorage.app",
      messagingSenderId: "351370021203",
      appId: "1:351370021203:web:8d0ca697abc1646d4079a6",
      measurementId: "G-59JJEDNL8E",
      databaseURL: "https://leonidasgoalstracker-default-rtdb.europe-west1.firebasedatabase.app"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const weeksContainer = document.getElementById("weeks");

    function getChartTextColor() {
      return document.body.getAttribute("data-theme") === "dark"
        ? "#f1f5f9"
        : "#111827";
    }

    function getChartGridColor() {
      return document.body.getAttribute("data-theme") === "dark"
        ? "rgba(255,255,255,0.12)"
        : "rgba(0,0,0,0.10)";
    }

    let chart;

    function renderChart(allData) {
      const totals = {};

      for (let week in allData) {
        for (let player in allData[week]) {
          if (player === "_opponent") continue;
          totals[player] = (totals[player] || 0) + allData[week][player];
        }
      }

      const sorted = Object.entries(totals)
        .sort((a, b) => b[1] - a[1]);

      const labels = sorted.map(([p]) => p);
      const data = sorted.map(([_, g]) => g);

      const colors = labels.map(
        (_, i) => `hsl(${i * 40}, 75%, 52%)`
      );

      if (chart) chart.destroy();

      chart = new Chart(document.getElementById("goalsChart"), {
        type: "bar",
        data: {
          labels,
          datasets: [{
            data,
            backgroundColor: colors,
            borderRadius: 10,
            borderSkipped: false
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              display: false
            }
          },
          indexAxis: "y",
          scales: {
            x: {
              ticks: {
                precision: 0,
                color: getChartTextColor(),
                font: {
                  weight: "700",
                  size: 14
                }
              },
              grid: {
                color: getChartGridColor()
              },
              border: {
                color: getChartGridColor()
              }
            },
            y: {
              ticks: {
                color: getChartTextColor(),
                font: {
                  weight: "700",
                  size: 14
                }
              },
              grid: {
                color: getChartGridColor()
              },
              border: {
                color: getChartGridColor()
              }
            }
          }
        }
      });
    }

    function renderWeek(week, data) {
      const opponent = data._opponent || "";
      const opponentClass = opponent ? "fw-bold" : "";

      let html = `
        <div class="week-container">
          <div class="week-title">${week.replace("Week", "Week ")}</div>

          <table class="table">
            <thead>
              <tr>
                <th>Player</th>
                <th>Goals</th>
                <th class="text-end">
                  Opponent
                  <input 
                    type="text" 
                    class="form-control d-inline-block w-auto ${opponentClass}" 
                    value="${opponent}" 
                    onchange="saveOpponent('${week}', this.value)"
                  >
                </th>
              </tr>
            </thead>

            <tbody>
      `;

      for (let player in data) {
        if (player === "_opponent") continue;

        html += `
          <tr>
            <td><b>${player}</b></td>
            <td>${data[player]}</td>

            <td>
              <div class="btn-group d-flex flex-wrap" role="group">
                <button 
                  class="btn btn-add btn-sm flex-fill" 
                  onclick="updateGoals('${week}','${player}',1)"
                >
                  +1
                </button>

                <button 
                  class="btn btn-minus btn-sm flex-fill" 
                  onclick="updateGoals('${week}','${player}',-1)"
                >
                  -1
                </button>

                <button 
                  class="btn btn-remove btn-sm flex-fill" 
                  onclick="removePlayer('${week}','${player}')"
                >
                  X
                </button>
              </div>
            </td>
          </tr>
        `;
      }

      html += `
            <tr class="add-player-row">
              <td colspan="3">
                <div class="d-flex align-items-center gap-2">
                  <input 
                    type="text" 
                    id="newPlayer-${week}" 
                    class="form-control add-player-input" 
                    placeholder="Player name"
                  >

                  <button 
                    class="btn btn-action btn-sm" 
                    onclick="addPlayer('${week}')"
                  >
                    Add Player
                  </button>
                </div>
              </td>
            </tr>

            </tbody>
          </table>
        </div>
      `;

      return html;
    }

    function updateGoals(week, player, delta) {
      const ref = db.ref("goals/" + week + "/" + player);

      ref.transaction(current => {
        return (current || 0) + delta > 0
          ? (current || 0) + delta
          : 0;
      });
    }

    function removePlayer(week, player) {
      db.ref("goals/" + week + "/" + player).remove();
    }

    function addPlayer(week) {
      const input = document.getElementById("newPlayer-" + week);
      const name = input.value.trim();

      if (name) {
        db.ref("goals/" + week + "/" + name).set(0);
        input.value = "";
      }
    }

    function saveOpponent(week, opponent) {
      db.ref("goals/" + week + "/_opponent").set(opponent);
    }

    db.ref("goals").on("value", snapshot => {
      const data = snapshot.val() || {};

      weeksContainer.innerHTML = "";

      for (let i = 1; i <= 20; i++) {
        const week = "Week" + i;
        weeksContainer.innerHTML += renderWeek(
          week,
          data[week] || {}
        );
      }

      renderChart(data);
    });

    const themeToggle = document.getElementById("themeToggle");

    let darkMode = false;

    themeToggle.addEventListener("click", () => {
      if (darkMode) {
        document.body.removeAttribute("data-theme");
        themeToggle.textContent = "🌙 Dark Mode";
        darkMode = false;
      } else {
        document.body.setAttribute("data-theme", "dark");
        themeToggle.textContent = "☀️ Light Mode";
        darkMode = true;
      }

      db.ref("goals").once("value", snap => {
        renderChart(snap.val() || {});
      });
    });
  </script>
</body>
</html>
